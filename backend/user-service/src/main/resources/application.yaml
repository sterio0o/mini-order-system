spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/userdb
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:9092

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG