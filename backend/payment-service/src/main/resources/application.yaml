spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/paymentdb
    username: postgres
    password: root
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        enabled: true