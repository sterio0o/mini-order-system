global:
  scrape_interval: 5s # Как часто prometheus будет собирать метрики с экспортеров

# Конфиг если приложение запускается в docker
#scrape_configs:
#  - job_name: 'order-service'
#    metrics_path: '/actuator/prometheus'
#    static_configs:
#      - targets: ['spring-app:8081'] # spring-app это имя сервиса в docker

# Конфиг если приложение поднимается локально
scrape_configs:
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: "payment-service"
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8082']